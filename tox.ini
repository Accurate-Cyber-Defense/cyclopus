[tox]
envlist = py38, py39, py310, py311
skipsdist = True

[testenv]
deps =
    -rrequirements.txt
    pytest
    pytest-cov
    black
    flake8
    mypy
commands =
    pytest commands-test.py -v --cov=. --cov-report=html
    black --check cyclopus.py || echo "Black formatting needed"
    flake8 cyclopus.py --max-line-length=120 || echo "Flake8 issues found"